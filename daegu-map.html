<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>대구 무장애 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { margin:0; padding:0; width:100%; height:100vh; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 大邱中心坐标
        const map = L.map('map').setView([35.8714, 128.6014], 13);

        // OpenStreetMap 瓦片（支持韩国大邱）
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // 接收小程序传来的设施数据并添加标记
        window.addEventListener('message', (event) => {
            if (event.data.type === 'addFacilities') {
                const facilities = event.data.facilities || [];
                facilities.forEach(item => {
                    if (item.lat && item.lng) {
                        L.marker([item.lat, item.lng])
                            .addTo(map)
                            .bindPopup(`<b>${item.name || '무장애 시설'}</b>`);
                    }
                });
            }
        });

        console.log('✅ 대구 Leaflet 지도 로드 완료');
    </script>
</body>
</html>
